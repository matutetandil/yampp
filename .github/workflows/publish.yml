name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-plugin-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (plugin-types)
        working-directory: packages/plugin-types
        run: pnpm install

      - name: Build plugin-types
        working-directory: packages/plugin-types
        run: pnpm run build

      - name: Publish plugin-types to npm
        working-directory: packages/plugin-types
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-yampp:
    runs-on: ubuntu-latest
    needs: publish-plugin-types
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (yampp)
        working-directory: packages/yampp
        run: pnpm install

      - name: Build yampp
        working-directory: packages/yampp
        run: pnpm run build

      - name: Run tests
        working-directory: packages/yampp
        run: pnpm test

      - name: Publish yampp to npm
        working-directory: packages/yampp
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
